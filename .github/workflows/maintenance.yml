name: Approved dependency maintenance
on:
  workflow_run:
    workflows: [Validation]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: approved-maintenance-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  merge-approved-patch:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {approvedPatch}=require('./scripts/maintenance-policy.cjs');
            const run=context.payload.workflow_run;
            const refs=run.pull_requests;
            if(refs.length!==1)return;
            const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:refs[0].number});
            if(pr.state!=='open' || pr.draft || pr.user.login!=='dependabot[bot]' ||
               pr.base.ref!==context.payload.repository.default_branch || pr.head.repo.full_name!==context.payload.repository.full_name ||
               pr.head.sha!==run.head_sha || !pr.labels.some(label=>label.name==='maintenance-approved'))return;
            const reviews=await github.paginate(github.rest.pulls.listReviews,{...context.repo,pull_number:pr.number});
            const latest=new Map();
            for(const review of reviews)if(review.state!=='COMMENTED')latest.set(review.user.login,review);
            if([...latest.values()].some(review=>review.state==='CHANGES_REQUESTED'))return;
            if(![...latest.values()].some(review=>review.state==='APPROVED' && review.commit_id===pr.head.sha &&
              ['OWNER','MEMBER','COLLABORATOR'].includes(review.author_association)))return;
            const checks=await github.paginate(github.rest.checks.listForRef,{...context.repo,ref:pr.head.sha,per_page:100});
            const required=['real-world',...['ubuntu-latest','windows-latest','macos-latest'].flatMap(os=>['22','24'].map(node=>`validate (${os}, ${node})`))];
            for(const name of required){
              const check=checks.filter(check=>check.name===name && check.app.slug==='github-actions').sort((a,b)=>b.id-a.id)[0];
              if(!check || check.status!=='completed' || check.conclusion!=='success')return;
            }
            const files=await github.paginate(github.rest.pulls.listFiles,{...context.repo,pull_number:pr.number});
            const read=async(ref,path)=>{
              const {data}=await github.rest.repos.getContent({...context.repo,ref,path});
              if(Array.isArray(data)||data.encoding!=='base64'||data.size>1024*1024)throw Error('Unexpected manifest');
              return JSON.parse(Buffer.from(data.content,'base64').toString('utf8'));
            };
            const [base,head,oldLock,newLock]=await Promise.all([
              read(pr.base.sha,'package.json'),read(pr.head.sha,'package.json'),
              read(pr.base.sha,'package-lock.json'),read(pr.head.sha,'package-lock.json')]);
            if(!approvedPatch(base,head,oldLock,newLock,files.map(file=>file.filename)))return;
            const comparison=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:`${pr.base.sha}...${pr.head.sha}`});
            if(comparison.data.merge_base_commit.sha!==pr.base.sha)return;
            await github.rest.pulls.merge({...context.repo,pull_number:pr.number,sha:pr.head.sha,merge_method:'merge'});
