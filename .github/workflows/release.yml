name: Approved npm release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact approved package version
        required: true
        type: string
      approved_commit:
        description: Exact 40-character approved commit SHA on the default branch
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify approval identifies this revision
        env:
          APPROVED_VERSION: ${{ inputs.version }}
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: node scripts/verify-release.mjs
      - run: npm install --global npm@11.6.4
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm audit --audit-level=moderate
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.6.4
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify approved metadata again
        env:
          APPROVED_VERSION: ${{ inputs.version }}
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: node scripts/verify-release.mjs
      - run: npm publish --access public --provenance
